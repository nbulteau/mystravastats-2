name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts-and-catalog:
    name: Contracts and catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26.5.0
      - uses: actions/setup-go@v7
        with:
          go-version-file: back-go/go.mod
          cache: false
      - name: Check generated OpenAPI contracts
        run: node scripts/generate-api-contracts.mjs --check
      - name: Check architecture boundaries
        run: node scripts/check-architecture.mjs
      - name: Audit climb catalog parity
        run: python3 scripts/audit-climb-catalog.py --check

  go:
    name: Go backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: back-go/go.mod
          cache-dependency-path: back-go/go.sum
      - name: Vet
        working-directory: back-go
        run: go vet ./...
      - name: Test with coverage threshold
        run: ./scripts/check-go-coverage.sh
      - name: Build
        working-directory: back-go
        run: go build ./...

  kotlin:
    name: Kotlin backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Test, coverage and build
        working-directory: back-kotlin
        run: ./gradlew check

  frontend:
    name: Vue frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26.5.0
          cache: npm
          cache-dependency-path: front-vue/package-lock.json
      - name: Install dependencies
        working-directory: front-vue
        run: npm ci
      - name: Lint
        working-directory: front-vue
        run: npm run lint:check
      - name: Type check
        working-directory: front-vue
        run: npm run type-check
      - name: Unit tests and coverage threshold
        working-directory: front-vue
        run: npm run test:coverage
      - name: Production build and bundle budgets
        working-directory: front-vue
        run: npm run build:check

  e2e:
    name: Browser journeys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26.5.0
          cache: npm
          cache-dependency-path: front-vue/package-lock.json
      - name: Install dependencies
        working-directory: front-vue
        run: npm ci
      - name: Install Chromium
        working-directory: front-vue
        run: npx playwright install --with-deps chromium
      - name: Run critical browser journeys
        working-directory: front-vue
        run: npm run test:e2e

  docker:
    name: Docker image (${{ matrix.name }})
    needs: [contracts-and-catalog, go, kotlin, frontend, e2e]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: go
            context: .
            file: back-go/Dockerfile
          - name: kotlin
            context: back-kotlin
            file: back-kotlin/Dockerfile
          - name: frontend
            context: front-vue
            file: front-vue/Dockerfile
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          tags: mystravastats-${{ matrix.name }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
